<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>灵动岛音乐播放器 · Dynamic Island Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --accent: #ff6ad5;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 0%, #2c2c3a 0%, #16161d 45%, #0a0a0f 100%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    padding: 0 16px 48px;
  }

  /* ---------- 灵动岛 ---------- */
  .stage {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 14px;
    position: sticky;
    top: 0;
    z-index: 50;
    pointer-events: none;
  }
  .island {
    pointer-events: auto;
    background: #000;
    color: #fff;
    border-radius: 999px;
    min-width: 124px;
    height: 37px;
    display: flex;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    transition: width .55s var(--spring), height .55s var(--spring), border-radius .45s var(--ease);
    will-change: width, height;
    user-select: none;
  }
  .island[data-state="idle"]           { width: 124px; }
  .island[data-state="music"]          { width: 340px; max-width: calc(100vw - 32px); }
  .island[data-state="call"]           { width: 340px; max-width: calc(100vw - 32px); }
  .island[data-state="music-expanded"] { width: 360px; max-width: calc(100vw - 32px); height: 172px; border-radius: 36px; }
  .island[data-state="call-active"]    { width: 340px; max-width: calc(100vw - 32px); }

  .island-inner { position: relative; width: 100%; height: 100%; }
  .panel {
    position: absolute; inset: 0; display: flex; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity .3s var(--ease);
  }
  .island[data-state="idle"]           .panel--idle,
  .island[data-state="music"]          .panel--music,
  .island[data-state="music-expanded"] .panel--music-x,
  .island[data-state="call"]           .panel--call,
  .island[data-state="call-active"]    .panel--call-active {
    opacity: 1; pointer-events: auto; transition-delay: .12s;
  }

  .panel--idle { justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #1c1c22; }

  .row { display: flex; align-items: center; width: 100%; padding: 0 12px; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: 13px; font-weight: 600; }
  .sub { font-size: 11px; opacity: .6; }

  .art {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    background: linear-gradient(135deg, var(--accent), #ff9a3c);
  }
  .art.big { width: 56px; height: 56px; border-radius: 14px; font-size: 27px; }
  .art.green { background: linear-gradient(135deg, #34c759, #30d158); }

  .bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .bars span { width: 3px; height: 4px; background: #34c759; border-radius: 2px; }
  .bars.playing span { animation: bounce .9s ease-in-out infinite; }
  .bars.playing span:nth-child(2){ animation-delay: .15s; }
  .bars.playing span:nth-child(3){ animation-delay: .3s; }
  .bars.playing span:nth-child(4){ animation-delay: .45s; }
  @keyframes bounce { 0%,100%{ height:4px } 50%{ height:16px } }

  /* 展开态 */
  .expanded { flex-direction: column; padding: 15px 18px; gap: 11px; justify-content: center; }
  .expanded .top { display: flex; align-items: center; gap: 12px; width: 100%; }
  .mini-prog { width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
  .mini-prog > i { display: block; height: 100%; width: 0%; background: #fff; border-radius: 2px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; }
  .ctrl { font-size: 22px; opacity: .92; cursor: pointer; line-height: 1; }
  .ctrl.play { font-size: 27px; }
  .ctrl:active { opacity: .5; }

  /* 来电 */
  .call-btns { display: flex; gap: 12px; margin-left: auto; }
  .cbtn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; cursor: pointer; }
  .cbtn:active { transform: scale(.9); }
  .cbtn.decline { background: #ff3b30; }
  .cbtn.accept  { background: #34c759; }
  .call-timer { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: #34c759; }

  /* ---------- 页面 ---------- */
  .hero { text-align: center; margin: 44px 0 4px; max-width: 460px; }
  .hero h1 { font-size: 25px; font-weight: 700; letter-spacing: -.5px; }
  .hero p { margin-top: 8px; font-size: 13px; line-height: 1.6; opacity: .55; }

  .player {
    width: 100%; max-width: 420px; margin-top: 26px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 24px; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .np { display: flex; align-items: center; gap: 14px; }
  .np .cover {
    width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #ff9a3c);
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .np .meta { min-width: 0; }
  .np .meta .t { font-size: 16px; font-weight: 600; }
  .np .meta .a { font-size: 13px; opacity: .55; margin-top: 2px; }

  .seek { display: flex; flex-direction: column; gap: 6px; }
  .track {
    height: 6px; border-radius: 3px; background: rgba(255,255,255,.15);
    position: relative; cursor: pointer;
  }
  .track > i { position: absolute; inset: 0 auto 0 0; width: 0%; background: #fff; border-radius: 3px; }
  .track > b {
    position: absolute; top: 50%; left: 0%; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%); box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .times { display: flex; justify-content: space-between; font-size: 11px; opacity: .5; font-variant-numeric: tabular-nums; }

  .btns { display: flex; align-items: center; justify-content: center; gap: 34px; }
  .btns button {
    background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .btns button:active { opacity: .5; }
  .btns .play-btn {
    width: 58px; height: 58px; border-radius: 50%; background: #fff; color: #111; font-size: 26px;
  }
  .btns button:focus-visible, .track:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .vol { display: flex; align-items: center; gap: 10px; font-size: 13px; opacity: .8; }
  .vol input { flex: 1; accent-color: var(--accent); }

  .actions { display: flex; gap: 10px; }
  .actions .abtn {
    flex: 1; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .actions .abtn:active { background: rgba(255,255,255,.14); }

  .list { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .list .item {
    display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px; cursor: pointer;
  }
  .list .item:hover { background: rgba(255,255,255,.05); }
  .list .item.active { background: rgba(255,255,255,.1); }
  .list .item .ic { width: 20px; text-align: center; font-size: 14px; opacity: .8; }
  .list .item.active .ic { color: #34c759; }
  .list .item .nm { font-size: 13px; font-weight: 500; }
  .list .item .ar { font-size: 11px; opacity: .5; }
  .list .item .own { margin-left: auto; font-size: 10px; opacity: .4; }

  footer { margin-top: 30px; font-size: 11px; opacity: .35; text-align: center; line-height: 1.7; max-width: 420px; }

  @media (prefers-reduced-motion: reduce) {
    .bars.playing span { animation: none; height: 10px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="island" id="island" data-state="idle">
      <div class="island-inner">

        <div class="panel panel--idle"><div class="dot"></div></div>

        <!-- 音乐紧凑态 -->
        <div class="panel panel--music">
          <div class="row">
            <div class="art" id="i-art">🎵</div>
            <div class="grow">
              <div class="title truncate" id="i-title">未在播放</div>
              <div class="sub truncate" id="i-artist">点击播放</div>
            </div>
            <div class="bars" id="i-bars"><span></span><span></span><span></span><span></span></div>
          </div>
        </div>

        <!-- 音乐展开态 -->
        <div class="panel panel--music-x">
          <div class="row expanded">
            <div class="top">
              <div class="art big" id="ix-art">🎵</div>
              <div class="grow">
                <div class="title truncate" id="ix-title">未在播放</div>
                <div class="sub truncate" id="ix-artist">—</div>
              </div>
            </div>
            <div class="mini-prog"><i id="ix-prog"></i></div>
            <div class="controls">
              <div class="ctrl" data-act="prev">⏮</div>
              <div class="ctrl play" data-act="toggle" id="ix-play">▶︎</div>
              <div class="ctrl" data-act="next">⏭</div>
            </div>
          </div>
        </div>

        <!-- 来电响铃 -->
        <div class="panel panel--call">
          <div class="row">
            <div class="art green">👤</div>
            <div class="grow">
              <div class="title truncate">来电</div>
              <div class="sub truncate" id="call-name">妈妈</div>
            </div>
            <div class="call-btns">
              <div class="cbtn decline" data-act="decline">✕</div>
              <div class="cbtn accept" data-act="accept">✆</div>
            </div>
          </div>
        </div>

        <!-- 通话中 -->
        <div class="panel panel--call-active">
          <div class="row">
            <div class="art green">👤</div>
            <div class="grow">
              <div class="title truncate" id="active-name">妈妈</div>
              <div class="sub truncate">通话中…</div>
            </div>
            <div class="call-timer" id="call-timer">00:00</div>
            <div class="cbtn decline" data-act="hangup" style="margin-left:10px">✆</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="hero">
    <h1>灵动岛音乐播放器</h1>
    <p>真能用的播放器：播放会同步到顶部的灵动岛。可导入你自己的音乐，来电为模拟演示。</p>
  </div>

  <div class="player">
    <div class="np">
      <div class="cover" id="np-cover">🎵</div>
      <div class="meta grow">
        <div class="t truncate" id="np-title">未在播放</div>
        <div class="a truncate" id="np-artist">选一首开始</div>
      </div>
    </div>

    <div class="seek">
      <div class="track" id="track" tabindex="0" role="slider" aria-label="播放进度">
        <i id="track-fill"></i><b id="track-knob"></b>
      </div>
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>

    <div class="btns">
      <button data-act="prev" aria-label="上一首">⏮</button>
      <button class="play-btn" data-act="toggle" id="play-btn" aria-label="播放/暂停">▶︎</button>
      <button data-act="next" aria-label="下一首">⏭</button>
    </div>

    <div class="vol">
      <span>🔈</span>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="音量">
      <span>🔊</span>
    </div>

    <div class="actions">
      <button class="abtn" id="add-btn">＋ 添加我的音乐</button>
      <button class="abtn" id="call-btn">📞 模拟来电</button>
    </div>
    <input type="file" id="file" accept="audio/*" multiple hidden>

    <div class="list" id="list"></div>
  </div>

  <footer>
    这是网页 demo：音乐播放真实可用；来电为模拟演示，无法接入真实电话或 Spotify / Apple Music。
  </footer>

<script>
(function () {
  "use strict";

  // ---------- 音频引擎 ----------
  var ac = null;
  var master = null;
  function ensureAC() {
    if (ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.8;
    master.connect(ac.destination);
  }

  var N = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88, C5:523.25, G3:196.00 };
  function m(str) {
    // "C4:1 C4:1 G4:2" -> [{f,d}]
    return str.trim().split(/\s+/).map(function (tok) {
      var p = tok.split(":");
      return { f: p[0] === "R" ? 0 : N[p[0]], d: parseFloat(p[1]) };
    });
  }

  // 三首公有领域旋律
  var SYNTH = [
    { title: "小星星", artist: "合成演示", art: "⭐️", accent: "#ffd60a",
      melody: m("C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2") },
    { title: "欢乐颂", artist: "合成演示", art: "🎼", accent: "#0a84ff",
      melody: m("E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1 E4:1.5 D4:0.5 D4:2") },
    { title: "两只老虎", artist: "合成演示", art: "🐯", accent: "#ff9f0a",
      melody: m("C4:1 D4:1 E4:1 C4:1 C4:1 D4:1 E4:1 C4:1 E4:1 F4:1 G4:2 E4:1 F4:1 G4:2") }
  ];

  var BEAT = 0.42;
  function loopDur(mel) { var s = 0; for (var i = 0; i < mel.length; i++) s += mel[i].d; return s * BEAT; }
  function cumOffset(mel, idx) { var s = 0; for (var i = 0; i < idx; i++) s += mel[i].d; return s * BEAT; }

  var synth = { idx: 0, next: 0, timer: null, anchor: 0, mel: null };

  function scheduleNote(note, when) {
    if (!note.f) return;
    var osc = ac.createOscillator();
    var g = ac.createGain();
    osc.type = "triangle";
    osc.frequency.value = note.f;
    var dur = note.d * BEAT;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.28, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, when + Math.max(0.08, dur * 0.9));
    osc.connect(g); g.connect(master);
    osc.start(when);
    osc.stop(when + dur);
  }
  function synthScheduler() {
    while (synth.next < ac.currentTime + 0.2) {
      var note = synth.mel[synth.idx];
      scheduleNote(note, synth.next);
      synth.next += note.d * BEAT;
      synth.idx++;
      if (synth.idx >= synth.mel.length) synth.idx = 0;
    }
    synth.timer = setTimeout(synthScheduler, 50);
  }
  function synthStart(mel, fromIdx) {
    ensureAC();
    synth.mel = mel;
    synth.idx = fromIdx || 0;
    synth.next = ac.currentTime + 0.06;
    synth.anchor = synth.next - cumOffset(mel, synth.idx);
    synthScheduler();
  }
  function synthStop() {
    if (synth.timer) { clearTimeout(synth.timer); synth.timer = null; }
  }

  // ---------- 播放列表 ----------
  var audio = new Audio();
  audio.preload = "metadata";
  var playlist = SYNTH.map(function (t) {
    return { type: "synth", title: t.title, artist: t.artist, art: t.art, accent: t.accent, melody: t.melody, own: false };
  });
  var cur = 0;
  var playing = false;

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var island = $("island");
  var els = {
    npTitle: $("np-title"), npArtist: $("np-artist"), npCover: $("np-cover"),
    iTitle: $("i-title"), iArtist: $("i-artist"), iArt: $("i-art"), iBars: $("i-bars"),
    ixTitle: $("ix-title"), ixArtist: $("ix-artist"), ixArt: $("ix-art"), ixProg: $("ix-prog"), ixPlay: $("ix-play"),
    playBtn: $("play-btn"), trackFill: $("track-fill"), trackKnob: $("track-knob"),
    tCur: $("t-cur"), tDur: $("t-dur"), list: $("list")
  };

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var mm = Math.floor(s / 60), ss = Math.floor(s % 60);
    return mm + ":" + (ss < 10 ? "0" : "") + ss;
  }

  function setState(s) { island.dataset.state = s; }

  function renderList() {
    els.list.innerHTML = "";
    playlist.forEach(function (t, i) {
      var d = document.createElement("div");
      d.className = "item" + (i === cur ? " active" : "");
      d.innerHTML =
        '<div class="ic">' + (i === cur && playing ? "▶" : (t.art || "🎵")) + '</div>' +
        '<div class="grow"><div class="nm truncate">' + esc(t.title) + '</div>' +
        '<div class="ar truncate">' + esc(t.artist) + '</div></div>' +
        (t.own ? '<div class="own">我的</div>' : '');
      d.addEventListener("click", function () { selectTrack(i, true); });
      els.list.appendChild(d);
    });
  }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  function reflectMeta() {
    var t = playlist[cur];
    var accent = t.accent || "#ff6ad5";
    document.documentElement.style.setProperty("--accent", accent);
    els.npTitle.textContent = t.title;
    els.npArtist.textContent = t.artist;
    els.npCover.textContent = t.art || "🎵";
    els.iTitle.textContent = t.title;   els.iArtist.textContent = t.artist;   els.iArt.textContent = t.art || "🎵";
    els.ixTitle.textContent = t.title;  els.ixArtist.textContent = t.artist;  els.ixArt.textContent = t.art || "🎵";
  }

  function reflectPlaying() {
    var icon = playing ? "❚❚" : "▶︎";
    els.playBtn.textContent = icon;
    els.ixPlay.textContent = playing ? "❚❚" : "▶︎";
    els.iBars.classList.toggle("playing", playing);
    if (playing && island.dataset.state === "idle") setState("music");
    renderList();
  }

  function stopCurrent() {
    synthStop();
    audio.pause();
  }

  function startCurrent(fromIdx) {
    var t = playlist[cur];
    if (t.type === "synth") {
      audio.pause();
      synthStart(t.melody, fromIdx || 0);
    } else {
      synthStop();
      if (audio.src !== t.url) audio.src = t.url;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }
    playing = true;
    reflectPlaying();
  }

  function selectTrack(i, autoplay) {
    stopCurrent();
    cur = i;
    reflectMeta();
    if (autoplay) { startCurrent(0); }
    else { playing = false; reflectPlaying(); resetProgressUI(); }
  }

  function toggle() {
    ensureAC();
    if (ac.state === "suspended") ac.resume();
    if (playing) {
      stopCurrent();
      playing = false;
      reflectPlaying();
    } else {
      startCurrent(playlist[cur].type === "synth" ? synth.idx : 0);
    }
  }

  function next() { selectTrack((cur + 1) % playlist.length, true); }
  function prev() {
    // 3 秒内回到上一首，否则从头
    if (curProgress() > 3) { selectTrack(cur, true); }
    else { selectTrack((cur - 1 + playlist.length) % playlist.length, true); }
  }

  // ---------- 进度 ----------
  function curProgress() {
    var t = playlist[cur];
    if (t.type === "file") return audio.currentTime || 0;
    if (!ac || !playing) return synthPaused || 0;
    var d = loopDur(t.melody);
    return ((ac.currentTime - synth.anchor) % d + d) % d;
  }
  function curDuration() {
    var t = playlist[cur];
    if (t.type === "file") return audio.duration || 0;
    return loopDur(t.melody);
  }
  var synthPaused = 0;

  function resetProgressUI() {
    els.trackFill.style.width = "0%";
    els.trackKnob.style.left = "0%";
    els.ixProg.style.width = "0%";
    els.tCur.textContent = "0:00";
    els.tDur.textContent = fmt(curDuration());
  }

  function tick() {
    var dur = curDuration();
    var pos = playing ? curProgress() : (playlist[cur].type === "file" ? audio.currentTime : synthPaused);
    var ratio = dur > 0 ? Math.min(1, pos / dur) : 0;
    var pct = (ratio * 100).toFixed(2) + "%";
    els.trackFill.style.width = pct;
    els.trackKnob.style.left = pct;
    els.ixProg.style.width = pct;
    els.tCur.textContent = fmt(pos);
    els.tDur.textContent = fmt(dur);
    requestAnimationFrame(tick);
  }

  function seekTo(ratio) {
    var t = playlist[cur];
    ratio = Math.max(0, Math.min(1, ratio));
    if (t.type === "file") {
      if (isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
    } else {
      var d = loopDur(t.melody);
      var target = ratio * d;
      // 找到目标音符
      var acc = 0, idx = 0;
      for (var i = 0; i < t.melody.length; i++) {
        if (acc + t.melody[i].d * BEAT > target) { idx = i; break; }
        acc += t.melody[i].d * BEAT;
      }
      synthPaused = target;
      if (playing) { synthStop(); synthStart(t.melody, idx); }
    }
  }

  // 文件曲目结束自动下一首
  audio.addEventListener("ended", function () { next(); });

  // ---------- 事件 ----------
  island.addEventListener("click", function (e) {
    var act = e.target.getAttribute && e.target.getAttribute("data-act");
    if (act === "toggle") { toggle(); return; }
    if (act === "prev") { prev(); return; }
    if (act === "next") { next(); return; }
    if (act === "accept") { acceptCall(); return; }
    if (act === "decline") { endCall(); return; }
    if (act === "hangup") { endCall(); return; }
    // 点岛本体切换展开/收起
    var s = island.dataset.state;
    if (s === "music") setState("music-expanded");
    else if (s === "music-expanded") setState("music");
    else if (s === "idle") { setState("music"); }
  });

  document.querySelectorAll("[data-act]").forEach(function (el) {
    if (el.closest("#island")) return;
    el.addEventListener("click", function () {
      var a = el.getAttribute("data-act");
      if (a === "toggle") toggle();
      else if (a === "next") next();
      else if (a === "prev") prev();
    });
  });

  var track = $("track");
  function seekFromEvent(clientX) {
    var r = track.getBoundingClientRect();
    seekTo((clientX - r.left) / r.width);
  }
  track.addEventListener("click", function (e) { seekFromEvent(e.clientX); });
  var dragging = false;
  track.addEventListener("pointerdown", function (e) { dragging = true; track.setPointerCapture(e.pointerId); seekFromEvent(e.clientX); });
  track.addEventListener("pointermove", function (e) { if (dragging) seekFromEvent(e.clientX); });
  track.addEventListener("pointerup", function () { dragging = false; });
  track.addEventListener("keydown", function (e) {
    var step = 0.05;
    if (e.key === "ArrowRight") { seekTo((curProgress() / (curDuration() || 1)) + step); e.preventDefault(); }
    if (e.key === "ArrowLeft") { seekTo((curProgress() / (curDuration() || 1)) - step); e.preventDefault(); }
  });

  $("vol").addEventListener("input", function (e) {
    var v = e.target.value / 100;
    audio.volume = v;
    if (master) master.gain.value = v;
  });

  // 导入本地音乐
  $("add-btn").addEventListener("click", function () { $("file").click(); });
  $("file").addEventListener("change", function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;
    var firstNew = playlist.length;
    files.forEach(function (f) {
      playlist.push({
        type: "file", url: URL.createObjectURL(f),
        title: f.name.replace(/\.[^.]+$/, ""), artist: "我的音乐",
        art: "🎧", accent: "#30d158", own: true
      });
    });
    renderList();
    selectTrack(firstNew, true);
    e.target.value = "";
  });

  // ---------- 模拟来电 ----------
  var ring = { timer: null };
  var wasPlaying = false;
  var callTimer = null, callStart = 0;
  var CALLERS = ["妈妈", "老板", "外卖小哥", "10086", "快递驿站"];

  function ringOnce() {
    ensureAC();
    var t0 = ac.currentTime;
    [0, 0.4].forEach(function (off) {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 480;
      var o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = 620;
      o2.connect(g);
      g.gain.setValueAtTime(0, t0 + off);
      g.gain.linearRampToValueAtTime(0.18, t0 + off + 0.02);
      g.gain.setValueAtTime(0.18, t0 + off + 0.22);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + off + 0.32);
      o.connect(g); g.connect(ac.destination);
      o.start(t0 + off); o.stop(t0 + off + 0.34);
      o2.start(t0 + off); o2.stop(t0 + off + 0.34);
    });
  }
  function startCall() {
    ensureAC();
    if (ac.state === "suspended") ac.resume();
    wasPlaying = playing;
    if (playing) { stopCurrent(); playing = false; reflectPlaying(); }
    $("call-name").textContent = CALLERS[Math.floor(Math.random() * CALLERS.length)];
    setState("call");
    ringOnce();
    ring.timer = setInterval(ringOnce, 2000);
  }
  function stopRing() { if (ring.timer) { clearInterval(ring.timer); ring.timer = null; } }
  function acceptCall() {
    stopRing();
    $("active-name").textContent = $("call-name").textContent;
    setState("call-active");
    callStart = Date.now();
    $("call-timer").textContent = "00:00";
    callTimer = setInterval(function () {
      var s = Math.floor((Date.now() - callStart) / 1000);
      var mm = String(Math.floor(s / 60)).padStart(2, "0");
      var ss = String(s % 60).padStart(2, "0");
      $("call-timer").textContent = mm + ":" + ss;
    }, 500);
  }
  function endCall() {
    stopRing();
    if (callTimer) { clearInterval(callTimer); callTimer = null; }
    setState(playing ? "music" : "idle");
    if (wasPlaying && !playing) { startCurrent(playlist[cur].type === "synth" ? synth.idx : 0); }
  }
  $("call-btn").addEventListener("click", startCall);

  // ---------- 初始化 ----------
  reflectMeta();
  reflectPlaying();
  resetProgressUI();
  renderList();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
